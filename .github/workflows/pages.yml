name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 仅允许读取仓库、发布 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一次部署，新的推送取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # 仓库未开启 Pages 时自动开启（需要 pages: write 权限）
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 站点根目录就是仓库根目录（index.html 在最外层）
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
